name: Build RPi Android 14 Kernel (Extreme Cleanup)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 🗑️ Extreme Disk Cleanup (关键步骤)
      run: |
        echo ">>> Disk space before cleanup:"
        df -h
        
        echo ">>> Removing pre-installed software..."
        # 删除 Docker 镜像
        sudo docker image prune -a -f
        # 删除 Android SDK (极大)
        sudo rm -rf /usr/local/lib/android
        # 删除 .NET
        sudo rm -rf /usr/share/dotnet
        # 删除 Haskell
        sudo rm -rf /opt/ghc
        # 删除 CodeQL 分析工具
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        # 删除其他缓存
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        
        echo ">>> Disk space after cleanup:"
        df -h
        # 此时你应该拥有大约 50GB-60GB 的可用空间

    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses-dev dwarves cpio unzip rsync curl
        
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH
        
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: ⬇️ Sync Source Code (Shallow)
      run: |
        mkdir work
        cd work
        # 使用 --depth=1 和 -c (只拉取当前分支) 来最小化下载体积
        # repo init -u https://github.com/raspberry-vanilla/android_kernel_manifest -b android-14.0 --depth=1 --no-tags
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1-lts --depth=1 --no-tags
        curl -o .repo/local_manifests/manifest_brcm_rpi.xml -L https://raw.githubusercontent.com/raspberry-vanilla/android_kernel_manifest/android-14.0/manifest_brcm_rpi.xml --create-dirs
        # --no-clone-bundle --no-tags --optimized-fetch 进一步减少体积
        repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

    - name: 🛠️ Patch KernelSU & Fixes
      run: |
        cd work
        # 自动定位内核目录
        if [ -d "common" ]; then cd common; else cd kernel; fi
        
        echo ">>> Integrating KernelSU..."
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        
        echo ">>> Fixing flask.h error..."
        sed -i '/ccflags-y += -I$(srctree)\/drivers\/kernelsu/a ccflags-y += -I$(srctree)/security/selinux\nccflags-y += -I$(srctree)/security/selinux/include' drivers/kernelsu/Makefile
        
        echo ">>> Applying eBPF Configs..."
        if [ -f "arch/arm64/configs/bcm2711_defconfig" ]; then
            CONFIG_FILE="arch/arm64/configs/bcm2711_defconfig"
        else
            CONFIG_FILE="arch/arm64/configs/rpi4_defconfig"
        fi
        
        cat <<EOT >> $CONFIG_FILE
        CONFIG_KSU=y
        CONFIG_BPF=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_BPF_JIT=y
        CONFIG_DEBUG_INFO_BTF=y
        CONFIG_DEBUG_INFO=y
        CONFIG_KPROBES=y
        CONFIG_PERF_EVENTS=y
        CONFIG_FTRACE=y
        EOT

    - name: 🚀 Build Kernel
      run: |
        cd work
        echo ">>> Starting Build..."
        
        # 优先使用 Manifest 指定的构建脚本
        if [ -f "build/build.sh" ]; then
            BUILD_CONFIG=common/build.config.rpi4 build/build.sh
        elif [ -f "tools/bazel" ]; then
            # 如果是 Kleaf 构建系统，使用 bazel
            tools/bazel build --config=fast //common:rpi4
        else
            # 最后的保底手段：直接 Make
            echo "WARNING: Standard build scripts not found, falling back to make..."
            cd common
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            make bcm2711_defconfig
            make Image -j$(nproc)
        fi

    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpi-android14-kernel
        path: |
          work/out/**/dist/Image
          work/bazel-bin/**/Image
          work/common/arch/arm64/boot/Image
          work/out/**/dist/*.ko
